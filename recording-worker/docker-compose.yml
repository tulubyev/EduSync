version: '3.8'

services:
  recording-worker:
    build: .
    container_name: epa-recording-worker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BEGET_S3_ENDPOINT=${BEGET_S3_ENDPOINT}
      - BEGET_S3_ACCESS_KEY=${BEGET_S3_ACCESS_KEY}
      - BEGET_S3_SECRET_KEY=${BEGET_S3_SECRET_KEY}
      - BEGET_S3_BUCKET=${BEGET_S3_BUCKET}
      - WORKER_ID=worker-vps-01
      - API_SECRET=${API_SECRET}
      - PORT=3001
    volumes:
      - ./recordings:/app/recordings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3