name: Docker images

# Образы собираются здесь, на VPS их только pull-им (сборка на сервере не потянет).
on:
  push:
    branches: [main]
  # На PR образ только собирается (без публикации) — сломанный Dockerfile видно до merge
  pull_request:
    paths: ['Dockerfile', 'docker/**', 'package.json', 'package-lock.json', '.github/workflows/docker.yml']
  # Раз в неделю пересобираем: свежие yt-dlp/streamlink (площадки часто меняются)
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tulubyev/edusync

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
