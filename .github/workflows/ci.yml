name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Проверка типов (`npm run check`) пока не включена: в репозитории ~250
      # накопленных ошибок tsc. Включить, когда будут устранены.
      - name: Build web (vite + esbuild)
        run: npm run build
      - name: Build recording worker
        run: npm run build:worker
