name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Validate docker-compose.prod.yml with .env.example
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml --profile worker config -q
      - name: Build web (vite + esbuild)
        run: npm run build
      - name: Build recording worker
        run: npm run build:worker
